name: Water reminder

on:
  schedule:
    # Hourly, Mon-Fri, 09:00-17:00 ICT (UTC+7) -> 02:00-10:00 UTC
    - cron: "0 2-10 * * 1-5"
  workflow_dispatch:

concurrency:
  group: water-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send reminder
        env:
          GCHAT_WEBHOOK: ${{ secrets.GCHAT_WEBHOOK }}
        run: python water_reminder.py
